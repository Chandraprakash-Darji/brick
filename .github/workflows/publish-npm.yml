# Publish @brickkit/* to the npmjs public registry.
#
# Triggers:
#   - push a tag  `core-v<version>`  (e.g. core-v0.1.0) to publish @brickkit/core
#   - push a tag  `cli-v<version>`   (e.g. cli-v0.1.0)  to publish @brickkit/cli
#   - manual dispatch (inputs below) for re-runs
#
# The tag version must match the version in the package's package.json, or
# the job fails before publishing. Re-pushing an already-published version
# is a no-op (checked via `npm view`, not an error).
#
# Configure npm trusted publishing for brick-org/brick + publish-npm.yml.
# For the initial publish, NPM_TOKEN can be a granular token with write
# access to @brickkit and permission to publish without interactive 2FA.
#
# Each package builds to ./dist before packing (see package.json `build`
# script); `files: ["dist"]` keeps TS source out of the tarball.

name: Publish to npm

on:
  push:
    tags:
      - "core-v*"
      - "cli-v*"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - core
          - cli
      dry_run:
        description: "Pack without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  # Validate publishability on PRs touching the packages (no secrets needed).
  pack-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --dry-run
        working-directory: packages/core
      - run: npm pack --dry-run
        working-directory: packages/cli

  resolve: # PR validation never publishes; tags/dispatch always continue.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ref="${GITHUB_REF_NAME}"
          input="${{ inputs.package }}"
          if [[ "$ref" == core-v* ]]; then pkgs='["core"]';
          elif [[ "$ref" == cli-v* ]]; then pkgs='["cli"]';
          elif [[ "$input" == "core" ]]; then pkgs='["core"]';
          elif [[ "$input" == "cli" ]]; then pkgs='["cli"]';
          else pkgs='["core", "cli"]'; fi
          echo "matrix={\"pkg\":$pkgs}" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    permissions:
      contents: write # Create the GitHub release after npm publishing succeeds
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Build core first (cli typechecks against core dist)
        run: bun run build
        working-directory: .

      - name: Test packages
        run: bun test packages/core packages/cli

      - name: Resolve name and version
        id: meta
        working-directory: packages/${{ matrix.pkg }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="${GITHUB_REF_NAME#*-v}"
            if [[ "$version" != "$expected" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $version"
              exit 1
            fi
          fi

      - name: Skip if already published
        id: published
        working-directory: packages/${{ matrix.pkg }}
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true' && inputs.dry_run != true
        working-directory: packages/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.meta.outputs.name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE_KIND: ${{ matrix.pkg }}
        run: |
          tag="${PACKAGE_KIND}-v${PACKAGE_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$PACKAGE_NAME v$PACKAGE_VERSION" --generate-notes
          fi
