# Publish @brickkit/* to the npmjs public registry.
#
# Push v<version> to publish both packages and create one combined release.
# Package versions must match each other and the tag. Manual dispatch also
# supports verifying the release without publishing via dry_run.
#
# Configure npm trusted publishing for Chandraprakash-Darji/brick + publish-npm.yml.
# For the initial publish, NPM_TOKEN can be a granular token with write
# access to @brickkit and permission to publish without interactive 2FA.
#
# Each package builds to ./dist before packing (see package.json `build`
# script); `files: ["dist"]` keeps TS source out of the tarball.

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  # Validate publishability on PRs touching the packages (no secrets needed).
  pack-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --dry-run
        working-directory: packages/core
      - run: npm pack --dry-run
        working-directory: packages/cli

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, cli]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Build core first (cli typechecks against core dist)
        run: bun run build
        working-directory: .

      - name: Test packages
        run: bun test packages/core packages/cli

      - name: Resolve name and version
        id: meta
        working-directory: packages/${{ matrix.pkg }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          core_version="$(node -p "require('../core/package.json').version")"
          cli_version="$(node -p "require('../cli/package.json').version")"
          if [[ "$core_version" != "$cli_version" ]]; then
            echo "::error::core and cli versions must match"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$expected" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $version"
              exit 1
            fi
          fi

      - name: Skip if already published
        id: published
        working-directory: packages/${{ matrix.pkg }}
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true' && inputs.dry_run != true
        working-directory: packages/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  release:
    needs: publish
    if: inputs.dry_run != true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Create combined GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            bun scripts/release-notes.ts > /tmp/brick-release-notes.md
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$tag" --notes-file /tmp/brick-release-notes.md --latest
          fi
