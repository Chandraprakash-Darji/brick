# Publish @brickkit/* to the npmjs public registry.
#
# Push v<version> to publish both packages and create one combined release.
# Package versions must match each other and the tag. Manual dispatch bumps
# versions, commits and tags them, then publishes in the same workflow run.
# dry_run previews the bump and packs without changing refs or publishing.
#
# Configure npm trusted publishing for Chandraprakash-Darji/brick + publish-npm.yml.
# For the initial publish, NPM_TOKEN can be a granular token with write
# access to @brickkit and permission to publish without interactive 2FA.
#
# Each package builds to ./dist before packing (see package.json `build`
# script); `files: ["dist"]` keeps TS source out of the tarball.

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the bump and pack without committing or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance attestation

# Serialize releases so two manual runs cannot race to bump main or publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pack-pr-{0}', github.event.pull_request.number) || 'brick-release' }}
  cancel-in-progress: false

jobs:
  # Validate publishability on PRs touching the packages (no secrets needed).
  pack-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --dry-run
        working-directory: packages/core
      - run: npm pack --dry-run
        working-directory: packages/cli

  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run manual releases from main"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          bun-version: latest

      - name: Install release dependencies
        if: github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile

      - name: Bump, commit and tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            bun run release "$RELEASE_BUMP" --dry-run
          else
            bun run release "$RELEASE_BUMP"
          fi

      # GITHUB_TOKEN pushes do not trigger another workflow. Publish this exact
      # commit in the downstream jobs instead of relying on the tag push.
      - name: Resolve release target
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./packages/core/package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, cli]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Build core first (cli typechecks against core dist)
        run: bun run build
        working-directory: .

      - name: Test packages
        run: bun test packages/core packages/cli

      - name: Resolve name and version
        id: meta
        working-directory: packages/${{ matrix.pkg }}
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          core_version="$(node -p "require('../core/package.json').version")"
          cli_version="$(node -p "require('../cli/package.json').version")"
          if [[ "$core_version" != "$cli_version" ]]; then
            echo "::error::core and cli versions must match"
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          if [[ "$version" != "$expected" ]]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

      - name: Check tarball without publishing
        if: inputs.dry_run == true
        working-directory: packages/${{ matrix.pkg }}
        run: npm pack --dry-run

      - name: Skip if already published
        id: published
        working-directory: packages/${{ matrix.pkg }}
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true' && inputs.dry_run != true
        working-directory: packages/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  release:
    needs: [prepare, publish]
    if: inputs.dry_run != true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Create combined GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            bun scripts/release-notes.ts > /tmp/brick-release-notes.md
            gh release create "$tag" --target "$RELEASE_SHA" \
              --title "$tag" --notes-file /tmp/brick-release-notes.md --latest
          fi
